<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div data-header></div>
  <main class="page">
    <section class="shell auth-shell">
      <h1 class="page-title">로그인</h1>
      <form class="card auth-card" data-auth-form data-mode="login">
        <div class="form-group"><label class="form-label" for="email">이메일</label><input class="text-input" id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="form-group"><label class="form-label" for="password">비밀번호</label><input class="text-input" id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></div>
        <button class="primary-action full-width" type="submit">로그인</button>
        <p class="message" data-message hidden></p>
        <p class="auth-switch">아직 회원이 아니신가요? <a href="/signup.html">회원가입</a></p>
      </form>
    </section>
  </main>
  <script type="module" src="/auth.js"></script>
</body>
</html>
