<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제하기</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div data-header></div>
  <main class="page">
    <section class="shell">
      <h1 class="page-title">결제하기</h1>
      <div class="card checkout-card" data-checkout>
        <div class="payment-methods" id="payment-method"></div>
        <div class="payment-agreement" id="agreement"></div>
        <div class="checkout-total"><span>결제 금액</span><strong data-total>0원</strong></div>
        <button class="primary-action full-width" type="button" data-pay disabled>결제하기</button>
        <p class="message" data-message hidden></p>
      </div>
    </section>
  </main>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script type="module" src="/checkout.js"></script>
</body>
</html>
