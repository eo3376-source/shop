<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 목록</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div data-header></div>
  <main class="page">
    <section class="shell catalog-shell" aria-labelledby="catalog-title">
      <section class="catalog-intro" aria-labelledby="intro-title">
        <div class="catalog-intro-copy">
          <p class="catalog-intro-kicker">여덟 가지의 선택</p>
          <h1 class="catalog-intro-title" id="intro-title">일상 가까이 두는 물건들</h1>
          <p class="catalog-intro-description">잡화와 뷰티, 신발과 식품까지. 서로 다른 여덟 가지 상품을 한곳에서 차분히 살펴보세요.</p>
        </div>
        <div class="catalog-intro-gallery" aria-label="상품 분류별 대표 이미지">
          <div class="catalog-intro-image"><img src="/products/bag.jpg" alt="미니멀 토트백"></div>
          <div class="catalog-intro-image"><img src="/products/perfume.jpg" alt="시트러스 오드뚜왈렛"></div>
          <div class="catalog-intro-image"><img src="/products/shoe.jpg" alt="러닝화 블루"></div>
          <div class="catalog-intro-image"><img src="/products/pasta.jpg" alt="이탈리아 파스타 면"></div>
        </div>
      </section>
      <div class="catalog-heading">
        <div>
          <p class="catalog-kicker">COLLECTION</p>
          <h2 class="catalog-title" id="catalog-title">상품</h2>
        </div>
        <span class="catalog-count" data-product-count aria-live="polite"></span>
      </div>
      <div class="category-filter" role="tablist" aria-label="상품 분류" data-categories></div>
      <div class="product-grid" data-products aria-live="polite"></div>
      <p class="message" data-message hidden></p>
    </section>
  </main>
  <script type="module" src="/home.js"></script>
</body>
</html>
