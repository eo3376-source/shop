<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 목록</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div data-header></div>
  <main class="page">
    <section class="shell small-animal-intro" aria-labelledby="small-animal-title">
      <div class="small-animal-copy">
        <p class="intro-kicker">소동물 용품</p>
        <h1 class="intro-title" id="small-animal-title">작은 생활을 위한 물건들</h1>
        <p class="intro-description">새로 정리한 소동물 용품 이미지를 먼저 소개합니다.</p>
      </div>
      <div class="intro-gallery" aria-label="소동물 용품 이미지">
        <figure><img src="/home-assets/hideout.jpg" alt="블링블링 은신처"><figcaption>블링블링 은신처</figcaption></figure>
        <figure><img src="/home-assets/bowl.jpg" alt="엔젤윙 그릇"><figcaption>엔젤윙 그릇</figcaption></figure>
        <figure><img src="/home-assets/wand.jpg" alt="뽀로롱 요술봉"><figcaption>뽀로롱 요술봉</figcaption></figure>
      </div>
    </section>
    <section class="shell catalog-shell" aria-labelledby="catalog-title">
      <h1 class="catalog-title" id="catalog-title">상품</h1>
      <div class="category-filter" role="tablist" aria-label="상품 분류" data-categories></div>
      <div class="product-grid" data-products aria-live="polite"></div>
      <p class="message" data-message hidden></p>
    </section>
  </main>
  <script type="module" src="/home.js"></script>
</body>
</html>
