<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div data-header></div>
  <main class="page">
    <section class="shell auth-shell">
      <h1 class="page-title">회원가입</h1>
      <form class="card auth-card" data-auth-form data-mode="signup">
        <div class="form-group"><label class="form-label" for="name">이름</label><input class="text-input" id="name" name="name" type="text" autocomplete="name" maxlength="50" required></div>
        <div class="form-group"><label class="form-label" for="email">이메일</label><input class="text-input" id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="form-group"><label class="form-label" for="password">비밀번호</label><input class="text-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><div class="helper-text">8자 이상 입력해주세요.</div></div>
        <button class="primary-action full-width" type="submit">회원가입</button>
        <p class="message" data-message hidden></p>
        <p class="auth-switch">이미 회원이신가요? <a href="/login.html">로그인</a></p>
      </form>
    </section>
  </main>
  <script type="module" src="/auth.js"></script>
</body>
</html>
